<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Phác Họa — Studio vẽ tranh từng nét bút | devnvios.io.vn</title>
<meta name="theme-color" content="#ece5d8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Fraunces:ital,opsz,wght@1,9..144,500;1,9..144,600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#14202a; --bg2:#0d151c; --panel:rgba(255,255,255,.055); --line:rgba(255,255,255,.1);
  --txt:#eef1ee; --soft:#97a7ae; --pencil:#f1c04f; --pencil-ink:#1c1707; --mint:#7fd1b0;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  font-family:'Be Vietnam Pro',system-ui,sans-serif; color:var(--txt); min-height:100vh;
  background:radial-gradient(900px 500px at 12% -8%,rgba(241,192,79,.16),transparent 60%),
             radial-gradient(800px 600px at 100% 10%,rgba(127,209,176,.09),transparent 60%),
             linear-gradient(180deg,var(--bg),var(--bg2));
  -webkit-font-smoothing:antialiased; overflow-x:hidden;
}
.app{max-width:1500px;margin:0 auto;padding:max(18px,env(safe-area-inset-top)) clamp(12px,2.4vw,32px) 28px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.logo{display:flex;align-items:center;gap:12px}
.logo svg{width:44px;height:44px;flex:none;filter:drop-shadow(0 6px 10px rgba(0,0,0,.35))}
.logo h1{font-family:'Fraunces',serif;font-style:italic;font-weight:600;font-size:clamp(26px,4vw,38px);line-height:1;margin:0;letter-spacing:.2px}
.logo p{margin:4px 0 0;color:var(--soft);font-size:13px}
.domain{display:inline-flex;align-items:center;gap:8px;padding:9px 15px;border:1px solid var(--line);border-radius:999px;background:var(--panel);
  color:var(--txt);text-decoration:none;font-size:13.5px;font-weight:500;backdrop-filter:blur(8px)}
.domain i{width:8px;height:8px;border-radius:50%;background:var(--mint);box-shadow:0 0 0 4px rgba(127,209,176,.18)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:14px;backdrop-filter:blur(10px)}
.prompt{display:flex;gap:10px;flex-wrap:wrap}
.prompt input{flex:1 1 280px;min-width:0;border:1px solid var(--line);border-radius:14px;background:rgba(0,0,0,.28);color:var(--txt);
  padding:14px 16px;font:italic 500 18px 'Fraunces',serif}
.prompt input::placeholder{color:#6f8089}
.prompt input:focus-visible{outline:2px solid var(--pencil);outline-offset:1px}
button{font:500 14px 'Be Vietnam Pro',sans-serif;cursor:pointer;border-radius:13px;border:1px solid var(--line);background:rgba(255,255,255,.07);
  color:var(--txt);padding:11px 16px;transition:transform .12s,background .15s,border-color .15s}
button:hover{background:rgba(255,255,255,.13)}
button:active{transform:scale(.97)}
button:focus-visible{outline:2px solid var(--pencil);outline-offset:2px}
button:disabled{opacity:.4;cursor:default;transform:none}
.go{background:var(--pencil);color:var(--pencil-ink);border-color:var(--pencil);font-weight:600;padding:12px 22px}
.go:hover{background:#f6cd6c}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.chips button{padding:7px 13px;font-size:13px;border-radius:999px;color:var(--soft)}
.chips button:hover{color:var(--txt)}
.state{display:flex;align-items:center;gap:14px;margin:16px 4px 12px;flex-wrap:wrap}
.phase{font-size:12.5px;font-weight:600;color:var(--pencil-ink);background:var(--mint);padding:4px 11px;border-radius:999px;min-width:84px;text-align:center}
.phase.idle{background:var(--line);color:var(--soft)}
#status{font-family:'Fraunces',serif;font-style:italic;color:#c9d3d6;font-size:15px;flex:1 1 220px}
.bar{flex:1 1 180px;max-width:340px;height:6px;border-radius:9px;background:var(--line);overflow:hidden}
.bar b{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--mint),var(--pencil));border-radius:9px}
.desk{border-radius:26px;padding:clamp(8px,1.6vw,22px);background:linear-gradient(145deg,#233440,#1a2731);border:1px solid var(--line);
  box-shadow:0 30px 60px -20px rgba(0,0,0,.65),inset 0 1px 0 rgba(255,255,255,.07)}
.paper{position:relative;width:100%;border-radius:8px;overflow:hidden;background:#f6f0e2;touch-action:pan-y;
  box-shadow:0 18px 40px -12px rgba(0,0,0,.6),0 2px 0 rgba(255,255,255,.4) inset}
.paper:fullscreen{border-radius:0;background:#0b1015;display:flex;align-items:center;justify-content:center}
.paper:fullscreen canvas{width:auto;height:100%;max-width:100%}
canvas{display:block;width:100%;height:auto}
#pencil{position:absolute;left:0;top:0;pointer-events:none;opacity:0;transform-origin:0 50%;transition:opacity .25s;filter:drop-shadow(5px 9px 5px rgba(40,25,10,.28));will-change:transform}
#pencil svg{display:block;width:100%;height:auto}
.tools{margin-top:14px;display:flex;gap:14px 18px;flex-wrap:wrap;align-items:center}
.grp{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seg{display:flex;border:1px solid var(--line);border-radius:13px;overflow:hidden}
.seg button{border:0;border-radius:0;background:transparent;padding:10px 14px}
.seg button.on{background:var(--mint);color:var(--pencil-ink);font-weight:600}
.grp label{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--soft)}
input[type=range]{accent-color:var(--pencil);width:96px}
input[type=color]{width:36px;height:34px;border:1px solid var(--line);border-radius:10px;background:none;padding:2px}
.sep{width:1px;height:28px;background:var(--line)}
footer{text-align:center;color:var(--soft);font-size:12.5px;margin-top:26px}
footer a{color:var(--pencil);text-decoration:none}
@media (max-width:640px){.sep{display:none}.top{margin-bottom:14px}.domain{padding:8px 12px;font-size:12.5px}.go{flex:1 1 100%}.prompt button{flex:1 1 auto}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ===== Giao diện mới: phẳng, giấy kem + mực, không phát sáng ===== */
:root{--bg:#ece5d8;--bg2:#ece5d8;--panel:#f7f2e7;--line:#d6ccb8;--txt:#26231f;--soft:#7a7262;--pencil:#d9607f;--pencil-ink:#fff;--mint:#4a86c8}
body{background:var(--bg)}
.panel,.domain{backdrop-filter:none}
.domain i{box-shadow:none;background:var(--pencil)}
.logo svg{filter:none}.logo svg rect{fill:#d9607f}.logo svg path:last-child{stroke:#d9607f}
.prompt input{background:#fffdf7;color:var(--txt)}
.prompt input::placeholder{color:#a39a88}
button{background:#fffdf7;color:var(--txt)}
button:hover{background:#efe7d6}
.go{background:var(--pencil);color:#fff;border-color:var(--pencil)}.go:hover{background:#c9506f}
.phase.idle{background:var(--line);color:var(--soft)}
#status{color:#4d463a}
.desk{background:#d9cfba;border:1px solid var(--line);box-shadow:0 8px 0 -4px rgba(60,40,10,.12)}
.bar b{background:linear-gradient(90deg,#4a86c8,#e8708f)}
#intro{position:fixed;inset:0;z-index:99;background:#ece5d8;transition:opacity .8s;cursor:pointer}
#intro.out{opacity:0;pointer-events:none}
#intro canvas{width:100%;height:100%;display:block}
.panel{box-shadow:none;border-radius:18px}.chips button{background:#fffdf7;border-color:#d6ccb8}
.desk{background:#cfc3aa;box-shadow:none}.paper{box-shadow:0 1px 0 rgba(0,0,0,.1),0 16px 26px -16px rgba(60,40,10,.55)}
.logo h1{letter-spacing:0}.domain{background:#fffdf7}

/* ===== Giao diện trong v3: giấy kem, bo mềm, rõ ràng ===== */
body{background:radial-gradient(1200px 600px at 50% -10%,#f4eee2,#ece5d8 70%)}
.panel{background:#f8f4ea;border:1px solid #ddd3bf;border-radius:22px;padding:16px}
.prompt input{border:1.5px solid #d6ccb8;border-radius:16px;padding:15px 18px;transition:border-color .15s}
.prompt input:focus-visible{outline:none;border-color:#d9607f}
button{border-radius:14px;border:1.5px solid #d6ccb8;font-weight:600;letter-spacing:.1px}
.go{box-shadow:0 3px 0 #b8466a}.go:active{box-shadow:0 1px 0 #b8466a;transform:translateY(2px)}
.pick{background:#e4eefb;border-color:#a9c6ea;color:#2c5f9e}.pick:hover{background:#d3e4f8}
.chips button{font-weight:500;border-radius:999px;padding:8px 14px}.chips button:hover{border-color:#d9607f;color:#b8466a;background:#fff}
.phase{background:#4a86c8;color:#fff;border-radius:999px}.phase.idle{background:#e3dac6;color:#7a7262}
.bar{height:8px;background:#ddd3bf}
.desk{background:linear-gradient(#d6cab0,#c9bc9f);border-radius:28px;padding:clamp(10px,2vw,26px);border:1px solid #bfb294}
.paper{border-radius:6px}
.tools{gap:12px 14px;border-radius:22px}
.seg{background:#efe8d8;border:1.5px solid #d6ccb8;border-radius:14px;padding:3px;gap:2px}
.seg button{border-radius:11px;padding:9px 14px}.seg button.on{background:#4a86c8;color:#fff}
.grp button{padding:10px 14px}
input[type=range]{accent-color:#d9607f;width:110px}
footer{margin-top:22px}
@media (max-width:640px){.panel{padding:12px;border-radius:18px}.tools .grp{flex:1 1 100%}.tools .grp button{flex:1 1 auto}.seg button{flex:1}}

/* ===== v4: nâng cấp giao diện — giấy kem, băng dính washi, nút nổi mềm, chữ Love Thuy lấp lánh ===== */
:root{--rose:#d9607f;--rose-d:#b8466a;--sky:#4a86c8;--shadow:rgba(70,45,20,.38)}
body{background:
  radial-gradient(900px 520px at 6% -6%,rgba(255,168,190,.42),transparent 62%),
  radial-gradient(900px 560px at 100% 2%,rgba(128,178,240,.34),transparent 62%),
  radial-gradient(760px 520px at 50% 112%,rgba(255,208,150,.32),transparent 60%),#efe8da}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.55;mix-blend-mode:multiply;
  background-image:url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='160' height='160'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/%3E%3CfeColorMatrix values='0 0 0 0 .45 0 0 0 0 .36 0 0 0 0 .25 0 0 0 .2 0'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E")}
.app{position:relative;z-index:1}

/* đầu trang */
.top{flex-wrap:wrap;gap:14px 16px;margin-bottom:22px}
.logo svg{width:52px;height:52px;border-radius:15px;box-shadow:0 12px 18px -12px rgba(217,96,127,.85);transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
.logo svg:hover{transform:rotate(-8deg) scale(1.07)}
.logo h1{font-size:clamp(28px,4.4vw,42px);background:linear-gradient(95deg,#2b2620 0%,#5b3a47 62%,#d9607f 135%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;padding-right:4px}
.logo p{color:#8a8070;letter-spacing:.2px}
.domain{order:3;border:1.5px solid #d9cfba;box-shadow:0 8px 14px -12px var(--shadow);transition:transform .15s,box-shadow .15s}
.domain:hover{transform:translateY(-2px);box-shadow:0 14px 20px -14px var(--shadow)}

/* Love Thuy: chữ lướt ánh kim + trái tim đập, bấm vào sẽ bay tim */
.lovebadge{order:2;display:inline-flex;align-items:center;gap:10px;padding:9px 20px 10px 15px;border-radius:999px;cursor:pointer;position:relative;overflow:hidden;
  background:linear-gradient(135deg,#fff 0%,#fff3f6 52%,#edf5fd 100%);border:1.5px solid #efd5dc;
  box-shadow:0 12px 22px -14px rgba(217,96,127,.75),inset 0 1px 0 #fff;font-family:'Fraunces',Georgia,serif;font-style:italic;font-weight:600;
  font-size:clamp(21px,3.2vw,29px);line-height:1;transition:transform .2s cubic-bezier(.3,1.6,.5,1),box-shadow .2s;user-select:none;-webkit-tap-highlight-color:transparent}
.lovebadge:hover{transform:translateY(-2px) rotate(-1.2deg)}
.lovebadge:active{transform:scale(.97)}
.lovebadge:focus-visible{outline:2px solid var(--rose);outline-offset:3px}
.lovebadge::after{content:"";position:absolute;top:0;bottom:0;width:38%;left:-60%;transform:skewX(-20deg);background:linear-gradient(90deg,transparent,rgba(255,255,255,.85),transparent);animation:lbSweep 5.5s ease-in-out infinite}
.lb-text{display:inline-flex;gap:.26em;padding-right:2px}
.lb-l,.lb-t{background-size:230% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;animation:lbShine 4.4s ease-in-out infinite}
.lb-l{background-image:linear-gradient(100deg,#e0587f 0%,#f2739a 34%,#ffb3c9 50%,#f2739a 66%,#e0587f 100%)}
.lb-t{background-image:linear-gradient(100deg,#3f7fc6 0%,#5f9fe3 34%,#a9d2fb 50%,#5f9fe3 66%,#3f7fc6 100%);animation-delay:.3s}
.lb-heart{width:.85em;height:.85em;flex:none;color:#e0587f;display:inline-block;transform-origin:50% 60%;animation:lbBeat 1.7s ease-in-out infinite;filter:drop-shadow(0 3px 4px rgba(224,88,127,.45))}
@keyframes lbShine{0%{background-position:125% 0}62%,100%{background-position:-125% 0}}
@keyframes lbBeat{0%,100%{transform:scale(1)}12%{transform:scale(1.26)}26%{transform:scale(1)}40%{transform:scale(1.16)}66%{transform:scale(1)}}
@keyframes lbSweep{0%,55%{left:-60%}85%,100%{left:130%}}
.fh{position:fixed;z-index:60;pointer-events:none;width:22px;height:22px;margin:-11px 0 0 -11px;opacity:0;animation:fhUp 1.7s ease-out forwards}
.fh svg{width:100%;height:100%;display:block;filter:drop-shadow(0 2px 3px rgba(0,0,0,.18))}
@keyframes fhUp{0%{opacity:0;transform:translate(0,0) scale(.3) rotate(0)}14%{opacity:1}100%{opacity:0;transform:translate(var(--dx),-150px) scale(var(--s)) rotate(var(--r))}}

/* khung nhập + chip */
.panel{background:linear-gradient(180deg,#fffaf0,#f7f1e4);border:1.5px solid #e2d8c3;border-radius:26px;box-shadow:0 1px 0 #fff inset,0 26px 36px -30px var(--shadow)}
.prompt input{background:#fffefa;font-size:19px;border-radius:18px;box-shadow:0 2px 0 rgba(120,90,50,.06) inset}
.prompt input:focus-visible{border-color:var(--rose);box-shadow:0 0 0 5px rgba(217,96,127,.17)}
button{transition:transform .16s cubic-bezier(.3,1.5,.5,1),background .15s,border-color .15s,box-shadow .15s,color .15s}
button:hover{box-shadow:0 10px 14px -12px var(--shadow);transform:translateY(-1.5px)}
button:active{transform:translateY(1px) scale(.98)}
button:disabled{transform:none!important;box-shadow:none!important}
.go{background:linear-gradient(180deg,#ec7690,#d9607f);border-color:#c9506f;color:#fff;box-shadow:0 3px 0 #b8466a,0 16px 20px -14px rgba(217,96,127,.95)}
.go:hover{background:linear-gradient(180deg,#f3849d,#df6a88);box-shadow:0 3px 0 #b8466a,0 18px 22px -14px rgba(217,96,127,.95)}
.go:active{box-shadow:0 1px 0 #b8466a}
.pick{background:linear-gradient(180deg,#edf4fd,#dfeafa)}
.chips{gap:9px}
.chips button{background:#fffefa;border:1.5px solid #e2d8c3;color:#6b6252;padding:8px 15px;font-size:13px;box-shadow:0 2px 0 rgba(120,90,50,.07)}
.chips button:hover{border-color:var(--rose);color:var(--rose-d);background:#fff;transform:translateY(-2px)}

/* thanh trạng thái */
.state{margin:20px 6px 14px}
.phase{background:linear-gradient(135deg,#5a97d8,#3f7fc6);box-shadow:0 8px 12px -9px #3f7fc6;letter-spacing:.2px}
.phase.idle{background:#e8dfcb;box-shadow:none}
.bar{height:9px;border-radius:99px;background:#e1d7c2;box-shadow:inset 0 1px 2px rgba(80,60,30,.2)}
.bar b{position:relative;background:linear-gradient(90deg,#4a86c8,#a46ad0 52%,#e8708f);transition:width .2s linear}
.bar b::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.6),transparent);transform:translateX(-100%);animation:barShine 1.7s linear infinite}
@keyframes barShine{to{transform:translateX(100%)}}

/* bàn vẽ: giấy dán băng washi */
.desk{position:relative;background:linear-gradient(160deg,#d9cdb3,#c3b595);border:1.5px solid #b9aa88;border-radius:30px;box-shadow:0 1px 0 rgba(255,255,255,.55) inset,0 34px 40px -30px rgba(60,40,10,.75)}
.desk::before,.desk::after{content:"";position:absolute;width:clamp(58px,9vw,100px);height:clamp(18px,2.6vw,27px);z-index:3;pointer-events:none;box-shadow:0 2px 4px rgba(60,40,10,.2);
  background:repeating-linear-gradient(135deg,rgba(255,255,255,.4) 0 6px,rgba(255,255,255,.1) 6px 12px),rgba(244,170,190,.86)}
.desk::before{top:3px;left:clamp(14px,3vw,38px);transform:rotate(-7deg)}
.desk::after{bottom:3px;right:clamp(14px,3vw,38px);transform:rotate(-6deg);background:repeating-linear-gradient(135deg,rgba(255,255,255,.4) 0 6px,rgba(255,255,255,.1) 6px 12px),rgba(140,186,242,.86)}
.paper{border-radius:4px;box-shadow:0 1px 0 rgba(255,255,255,.5) inset,0 2px 0 rgba(0,0,0,.08),0 24px 34px -18px rgba(50,30,10,.8)}

/* thanh công cụ */
.tools{border-radius:26px}
.seg{background:#f0e8d6;box-shadow:inset 0 1px 2px rgba(80,60,30,.14)}
.seg button{box-shadow:none;transform:none}
.seg button:hover{box-shadow:none;transform:none;background:rgba(74,134,200,.12)}
.seg button.on,.seg button.on:hover{background:linear-gradient(180deg,#5a97d8,#4a86c8);color:#fff;box-shadow:0 5px 10px -6px #3f7fc6}
input[type=range]{height:6px}

/* chân trang */
footer{margin-top:30px;color:#8a8070}
.lovefoot{margin-top:12px;display:inline-flex;align-items:center;gap:9px;font:italic 600 21px 'Fraunces',Georgia,serif}

/* màn mở đầu */
#intro{background:radial-gradient(720px 440px at 18% 24%,rgba(255,170,190,.5),transparent 62%),radial-gradient(780px 470px at 84% 72%,rgba(130,186,246,.45),transparent 62%),radial-gradient(900px 620px at 50% 50%,#fcf7eb,#ece5d8 74%)}

@media (max-width:640px){
  .top{gap:12px}.logo svg{width:46px;height:46px}
  .lovebadge{order:4;flex:1 1 100%;justify-content:center;font-size:25px}
  .domain{order:2}
  .desk::before,.desk::after{display:none}
}
@media (prefers-reduced-motion:reduce){
  .lb-l,.lb-t,.lb-heart,.lovebadge::after,.bar b::after,.fh{animation:none!important}
  .lb-l,.lb-t{background-position:50% 0}
}
</style>
</head>
<body>
<div id="intro"><canvas></canvas></div>
<div class="app">
  <header class="top">
    <div class="logo">
      <svg viewBox="0 0 48 48" aria-hidden="true"><rect width="48" height="48" rx="13" fill="#f1c04f"/><path d="M12 36l2-8L31 11l6 6-17 17z" fill="#1c1707"/><path d="M12 36l2-8 6 6z" fill="#f6e1a8"/><path d="M28 14l6 6" stroke="#f1c04f" stroke-width="2"/></svg>
      <div><h1>Phác Họa</h1><p>studio vẽ tranh từng nét bút</p></div>
    </div>
    <div class="lovebadge" role="button" tabindex="0" aria-label="Love Thuy"><svg class="lb-heart" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg><span class="lb-text"><span class="lb-l">Love</span><span class="lb-t">Thuy</span></span></div>
    <a class="domain" href="https://devnvios.io.vn" target="_blank" rel="noopener"><i></i>devnvios.io.vn</a>
  </header>

  <section class="panel">
    <div class="prompt">
      <input id="theme" type="text" maxlength="60" placeholder="Ví dụ: chàng trai nắm tay cô gái ngồi ghế ngắm hoàng hôn" autocomplete="off">
      <button id="start" class="go">Bắt đầu vẽ</button>
      <button id="variant">Phiên bản khác</button><button id="pick" type="button" class="pick">🖼 Chọn ảnh</button><input id="file" type="file" accept="image/*" hidden>

<script>
(()=>{
"use strict";
const $=id=>document.getElementById(id);
const portrait=innerWidth<720&&innerHeight>innerWidth*.9;
const W0=portrait?1000:1600,H0=portrait?1250:1000,SC=1.25;let W=W0,H=H0;
const cv=$('cv'),ctx=cv.getContext('2d'),paper=$('paper');
cv.width=W*SC;cv.height=H*SC;
const tctx=document.createElement('canvas').getContext('2d');
const rr=(a,b)=>a+Math.random()*(b-a);

/* ---------- RNG ---------- */
function hash(s){let h=1779033703^s.length;for(let i=0;i<s.length;i++){h=Math.imul(h^s.charCodeAt(i),3432918353);h=(h<<13)|(h>>>19)}h=Math.imul(h^(h>>>16),2246822519);h=Math.imul(h^(h>>>13),3266489917);return(h^(h>>>16))>>>0}

let rnd=mulberry(1);const R=(a,b)=>a+rnd()*(b-a),pick=a=>a[Math.floor(rnd()*a.length)];

/* ---------- Màu ---------- */
const hx=h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16));
const mix=(a,b,t)=>{a=hx(a);b=hx(b);return'#'+a.map((v,i)=>Math.round(v+(b[i]-v)*t).toString(16).padStart(2,'0')).join('')};
const grad=(s,t)=>{const n=s.length-1,f=Math.min(.999,Math.max(0,t))*n,i=Math.floor(f);return mix(s[i],s[i+1],f-i)};

/* ---------- Giấy ---------- */
const paperCv=document.createElement('canvas');paperCv.width=cv.width;paperCv.height=cv.height;
(function(){const g=paperCv.getContext('2d');g.fillStyle='#f6f0e2';g.fillRect(0,0,paperCv.width,paperCv.height);
  const n=document.createElement('canvas');n.width=n.height=220;const ng=n.getContext('2d'),d=ng.createImageData(220,220);
  for(let i=0;i<d.data.length;i+=4){const v=215+Math.random()*40,a=Math.random()<.55?Math.random()*36:0;d.data[i]=v;d.data[i+1]=v*.97;d.data[i+2]=v*.9;d.data[i+3]=a}

  const v=g.createRadialGradient(paperCv.width/2,paperCv.height/2,paperCv.height*.4,paperCv.width/2,paperCv.height/2,paperCv.width*.72);
  v.addColorStop(0,'rgba(120,90,40,0)');v.addColorStop(1,'rgba(120,90,40,.16)');g.fillStyle=v;g.fillRect(0,0,paperCv.width,paperCv.height)})();
function reset(){ctx.setTransform(SC,0,0,SC,0,0);ctx.drawImage(paperCv,0,0,W,H)}

/* ---------- Hình học ---------- */
function spl(p,closed=true,n=8){const o=[],L=p.length,g=i=>closed?p[(i+L)%L]:p[Math.max(0,Math.min(L-1,i))],S=closed?L:L-1;
  for(let i=0;i<S;i++){const a=g(i-1),b=g(i),c=g(i+1),d=g(i+2);
    for(let k=0;k<n;k++){const s=k/n,s2=s*s,s3=s2*s,f=j=>.5*(2*b[j]+(-a[j]+c[j])*s+(2*a[j]-5*b[j]+4*c[j]-d[j])*s2+(-a[j]+3*b[j]-3*c[j]+d[j])*s3);o.push([f(0),f(1)])}}
  if(!closed)o.push(p[L-1]);return o}
const area=p=>{let s=0;for(let i=0;i<p.length;i++){const a=p[i],b=p[(i+1)%p.length];s+=a[0]*b[1]-b[0]*a[1]}return s/2};
function shape(p,smooth=true,n=8){let pts=smooth?spl(p,true,n):p.slice();if(area(pts)<0)pts.reverse();
  const path=new Path2D();pts.forEach((q,i)=>i?path.lineTo(q[0],q[1]):path.moveTo(q[0],q[1]));path.closePath();
  const xs=pts.map(q=>q[0]),ys=pts.map(q=>q[1]);return{pts,path,bb:{x0:Math.min(...xs),x1:Math.max(...xs),y0:Math.min(...ys),y1:Math.max(...ys)}}}
const circ=(x,y,rx,ry=rx)=>shape(Array.from({length:10},(_,i)=>[x+Math.cos(i/10*6.283)*rx,y+Math.sin(i/10*6.283)*ry]),true,5);
const plen=p=>{let s=0;for(let i=1;i<p.length;i++)s+=Math.hypot(p[i][0]-p[i-1][0],p[i][1]-p[i-1][1]);return s};
const dense=(p,st=16)=>{const o=[p[0]];for(let i=1;i<p.length;i++){const a=p[i-1],b=p[i],n=Math.max(1,Math.round(Math.hypot(b[0]-a[0],b[1]-a[1])/st));for(let k=1;k<=n;k++)o.push([a[0]+(b[0]-a[0])*k/n,a[1]+(b[1]-a[1])*k/n])}return o};
const noise=n=>{const a=Array.from({length:n+3},()=>rnd());return x=>{x=Math.max(0,Math.min(n-.001,x));const i=Math.floor(x),f=x-i,s=(1-Math.cos(f*Math.PI))/2;return a[i]*(1-s)+a[i+1]*s}};

/* ---------- Hàng đợi nét vẽ ---------- */
let Q=[],PH='s';
let SKIP=0;const job=o=>{if(SKIP)return o;o.ph=PH;Q.push(o);return o};
const fn=(f,st,wait)=>job({k:'f',fn:f,st,wait});
const pen=(p,w=1.6,a=.6,st,col='#4a4540')=>job({k:'l',g:1,pts:dense(p.map(q=>[q[0]+R(-.8,.8),q[1]+R(-.8,.8)]),15),w,a,col,st});
const outline=(sh,w,a,st,twice)=>{const c=sh.pts.concat([sh.pts[0]]);pen(c,w,a,st);if(twice)pen(c,w*.7,a*.55)};
const open=(p,w,a,st,col,n=6)=>pen(spl(p,false,n),w,a,st,col);
const dot=(x,y,w,col,a,comp)=>job({k:'l',pts:[[x,y],[x+.01,y]],w,a,col,comp,cap:'round'});

function hatch(sh,o){
  const{x0,y0,x1,y1}=sh.bb,ang=o.ang||0,ca=Math.cos(ang),sa=Math.sin(ang);
  const cs=[[x0,y0],[x1,y0],[x0,y1],[x1,y1]].map(([x,y])=>[x*ca+y*sa,-x*sa+y*ca]);
  const d0=Math.min(...cs.map(c=>c[0]))-4,d1=Math.max(...cs.map(c=>c[0]))+4,n0=Math.min(...cs.map(c=>c[1])),n1=Math.max(...cs.map(c=>c[1]));
  const sp=o.sp,L=[];
  for(let v=n0+sp/2;v<=n1;v+=sp*R(.8,1.2)){
    const runs=[];let cur=null;
    for(let u=d0;u<=d1;u+=6){const x=u*ca-v*sa,y=u*sa+v*ca;
      if(tctx.isPointInPath(sh.path,x,y)&&(!o.pred||o.pred(x,y))){if(!cur)runs.push(cur=[u,u]);cur[1]=u}else cur=null}
    if(runs.length)L.push({v,runs})}
  const G=o.g||3,jt=o.j??sp*.1;
  for(let i=0;i<L.length;i+=G){const pts=[];
    L.slice(i,i+G).forEach((ln,j)=>{let rs=ln.runs.map(r=>[r[0]-3,r[1]+3]);if((i+j)%2)rs=rs.reverse().map(r=>[r[1],r[0]]);
      rs.forEach(([a,b])=>{const n=Math.max(1,Math.round(Math.abs(b-a)/40));for(let q=0;q<=n;q++){const u=a+(b-a)*q/n,v=ln.v+R(-1,1)*jt;pts.push([u*ca-v*sa,u*sa+v*ca])}})});
    if(pts.length>1)job({k:'l',pts,col:typeof o.c==='function'?o.c((L[i].v-n0)/(n1-n0||1)):o.c,w:o.w||sp*1.6,a:o.a||.55,clip:sh.path,comp:o.comp,st:i?undefined:o.st})}
}
const paint=(sh,c,o={})=>{const sp=o.sp||6;hatch(sh,{c,ang:o.ang??.7,sp,w:o.w,a:o.a,g:o.g,pred:o.pred,comp:o.comp,st:o.st,j:o.j})};

/* ---------- Dựng cảnh ---------- */
let sil=null,baseSnap=null;
function build(theme,seed){
  rnd=mulberry(seed);Q=[];sil=null;if(usePhoto&&phSharp)return buildPhoto(theme,phSharp);return buildPhoto(theme,renderScene(theme,theme.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').toLowerCase(),seed));
  const t=theme.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').toLowerCase();
  if(/\bghe\b|nam tay|cap doi|couple|bench|yeu|\bbien\b|\bsea\b|beach|ho nuoc/.test(t))return buildCouple(theme,t);
  const hasP=/nguoi|co gai|co be|cau be|chang|thieu nu|chan dung|em be|phu nu|ban gai|girl|woman|boy|people|\bman\b/.test(t);
  const mood=/dem|trang|sao|night|moon/.test(t)?'n':/binh minh|sang|dawn|morning/.test(t)?'d':/trua|nang|xanh|day|sunny/.test(t)?'y':'s';
  const P={
   s:{sky:['#7d8fc4','#eab0a4','#fbd79a'],sun:'#fff0c2',glow:'#ffcf86',far:'#a5a9c4',hill:'#7f9a8a',g1:'#aebb6e',g2:'#6f8f4e',cloud:'#fff4e8',csh:'#c79fb0',road:'#c2a583'},
   d:{sky:['#98b6dc','#f3cfc6','#fde7bd'],sun:'#fffbd6',glow:'#ffe2a8',far:'#b4bfd6',hill:'#8cae94',g1:'#b4c47a',g2:'#78a055',cloud:'#fffaf4',csh:'#cdb2c0',road:'#c8ad8b'},
   y:{sky:['#4f8fd4','#9cc9ec','#d9eefa'],sun:'#fffbd0',glow:'#fffbd0',far:'#9db8d4',hill:'#6fa07a',g1:'#92c15e',g2:'#5c9540',cloud:'#ffffff',csh:'#b4c6dc',road:'#c9b08e'},
   n:{sky:['#0c1630','#1d2d5c','#3e5388'],sun:'#f6f2dc',glow:'#aebbe6',far:'#2a3a62',hill:'#22364a',g1:'#38573f',g2:'#223c2d',cloud:'#8d9cc4',csh:'#4a5a88',road:'#5d5a56'}}[mood];
  const hy=H*(portrait?.52:.57);
  const far=(()=>{const nz=noise(5),p=[];for(let x=-20;x<=W+20;x+=18)p.push([x,hy-H*.02-H*.17*nz((x+20)/(W+40)*3.2)]);return p})();
  const hill=(()=>{const nz=noise(5),p=[];for(let x=-20;x<=W+20;x+=18)p.push([x,hy+H*.015-H*.07*nz((x+20)/(W+40)*2.4)]);return p})();
  const farS=shape(far.concat([[W+20,hy+14],[-20,hy+14]]),false),hillS=shape(hill.concat([[W+20,hy+14],[-20,hy+14]]),false);
  const env=far.map((p,i)=>[p[0],Math.min(p[1],hill[i][1])]);
  const sky=shape([[-10,-10],[W+10,-10]].concat(env.slice().reverse()),false);
  const fieldS=shape([[-10,hy+12],[W+10,hy+12],[W+10,H+10],[-10,H+10]],false);
  /* đường */
  const hxr=W*R(.46,.6),bx=W*.34,ph=R(0,6),LP=[],RP=[],C=[];
  for(let i=0;i<=40;i++){const q=i/40,y=hy+12+(H+10-hy-12)*Math.pow(q,1.7),c=hxr+(bx-hxr)*q+Math.sin(q*5+ph)*W*.05*Math.pow(q,.8),w=3+Math.pow(q,1.6)*W*.12;LP.push([c-w,y]);RP.push([c+w,y]);C.push({c,y,w})}
  const roadS=shape(LP.concat(RP.slice().reverse()),false);
  const road=y=>{let b=C[0];for(const k of C)if(Math.abs(k.y-y)<Math.abs(b.y-y))b=k;return b};
  /* người */
  const ph_=H*(portrait?.5:.58),pcx=W*(portrait?.66:.7),py0=H-ph_-H*.04;
  /* cây */
  const trees=[];
  for(let n=0,tr=0;n<(hasP?5:8)&&tr<200;tr++){const y=R(hy+H*.03,H*.8),q=(y-hy)/(H-hy),s=.35+.9*q,x=R(40,W-40),r=road(y);
    if(Math.abs(x-r.c)<r.w+50*s)continue;if(hasP&&Math.abs(x-pcx)<ph_*.34)continue;
    if(trees.some(o=>Math.hypot(o.x-x,(o.y-y)*1.4)<(o.s+s)*70))continue;trees.push({x,y,s});n++}
  trees.sort((a,b)=>a.y-b.y);
  trees.forEach(o=>{const th=82*o.s;o.trunk=shape([[o.x-5*o.s,o.y],[o.x+5*o.s,o.y],[o.x+3*o.s,o.y-th],[o.x-3*o.s,o.y-th]],false);
    o.fol=Array.from({length:5},()=>circ(o.x+R(-34,34)*o.s,o.y-th-R(0,34)*o.s,R(26,42)*o.s));o.col=mix(P.g2,'#2f5a30',R(0,.5))});
  /* mặt trời / trăng */
  const sx=W*R(.18,.5),sr=H*(mood==='n'?.042:.058),sy=mood==='y'?H*.14:mood==='n'?H*.16:hy-H*R(.03,.09);
  const sunS=circ(sx,sy,sr),glowS=circ(sx,sy,sr*3.2);const inSky=(x,y)=>tctx.isPointInPath(sky.path,x,y);
  const clouds=Array.from({length:mood==='y'?5:4},()=>{const w=R(170,330),h=w*R(.2,.3),cx=R(.1,.9)*W,cy=R(.09,.5)*hy,n=5,p=[[cx-w/2,cy]];
    for(let i=0;i<n;i++)p.push([cx-w/2+w*(i+.5)/n,cy-h*(.35+.65*Math.sin(Math.PI*(i+.5)/n))*R(.75,1.05)]);
    p.push([cx+w/2,cy],[cx+w*.22,cy+h*.14],[cx-w*.22,cy+h*.14]);return shape(p,true,6)});

  /* ===== PHÁC THẢO ===== */
  PH='s';
  outline(sunS,1.4,.45,'Phác thảo mặt trời và mây…');
  clouds.forEach(c=>outline(c,1.5,.5));
  fn(()=>{},'Phác thảo đường chân trời…');
  pen(far,1.8,.6,'Phác thảo núi xa…');pen(hill,2,.65);
  pen(LP,1.8,.6,'Phác thảo con đường…');pen(RP,1.8,.6);
  trees.forEach((o,i)=>{outline(o.trunk,1.7,.6,i?undefined:'Phác thảo cây cối…');o.fol.forEach(f=>outline(f,1.7,.6,undefined,true))});
  for(let i=0;i<40;i++){const x=R(0,W),y=R(hy+H*.12,H),l=R(14,34),r=road(y);if(Math.abs(x-r.c)<r.w)continue;pen([[x,y],[x+R(-4,4),y-l]],1.1,.35,i?undefined:'Phác thảo cỏ…')}

  if(hasP){
    const h=ph_,u=h/100,cx=pcx,y0=py0,M=p=>p.map(([x,y])=>[cx+x*u,y0+y*u]),S=(p,n=8)=>shape(M(p),true,n),mir=p=>p.map(([x,y])=>[-x,y]);
    const hairC=pick(['#2b1d17','#4a2e1f','#6b3b22','#1c1a1f']),dressC=pick(['#c8505a','#4f7fb8','#e0a63c','#5a9a78','#8c6bb8']),skin='#f0c4a0',skinS='#cf9674';
    const male=/chang|trai|boy|\bman\b|cau be/.test(t);
    const hairB=S([[0,-2],[8,0],[11.5,8],[12.5,22],[13.5,38],[10,47],[4,45],[-4,45],[-10,47],[-13.5,38],[-12.5,22],[-11.5,8],[-8,0]].map(p=>male?[p[0]*.8,Math.min(p[1],p[1]>20?20:p[1])]:p));
    const neck=S([[-2.4,17],[2.4,17],[2.9,26],[-2.9,26]],6);
    const dress=S([[-9.5,26],[-3,24.2],[0,26.2],[3,24.2],[9.5,26],[8.2,40],[10.5,52],[16,66],[19,79],[8,81],[0,80],[-8,81],[-19,79],[-16,66],[-10.5,52],[-8.2,40]],6);
    const arm=[[-9.6,26],[-12.8,27.5],[-15.6,41],[-16.2,54],[-13.2,54.6],[-11.6,42],[-8.6,33]],hand=[[-16.4,54],[-13,54.2],[-12.6,58],[-14.6,60.2],[-16.8,58]],leg=[[-6.4,80],[-1.8,80],[-2.4,95],[-5.9,95]],shoe=[[-7.2,94.6],[-2,94.6],[-1.4,98.6],[-8.4,98.6]];
    const armL=S(arm),armR=S(mir(arm)),handL=S(hand,6),handR=S(mir(hand),6),legL=S(leg,6),legR=S(mir(leg),6),shL=S(shoe,5),shR=S(mir(shoe),5);
    const face=S([[0,.5],[5.8,2.5],[7.6,9],[6.4,14.5],[3.2,18.5],[0,19.8],[-3.2,18.5],[-6.4,14.5],[-7.6,9],[-5.8,2.5]]);
    const hairF=S([[-8,10],[-7.6,3],[-3.5,-1.2],[2,-1.2],[6.8,2.4],[8,10],[5.6,6.2],[2,3.8],[-1.5,3.4],[-5,5.6]]);
    const parts=[hairB,neck,dress,armL,armR,handL,handR,legL,legR,shL,shR,face,hairF];
    sil=new Path2D();parts.forEach(p=>sil.addPath(p.path));

  for(let i=0;i<150;i++){const x=R(-20,W+20),l=H*R(.04,.14),lean=R(-.25,.35)*l;blade(x,H+4,l,lean,R(5,11),mix('#05080d',P.ground[1],R(0,.6)),1)}
  /* đốm sáng li ti bay trong gió chiều */
  for(let i=0;i<34;i++){const x=R(0,W),y=R(hy-H*.22,hy+H*.22);g.fillStyle=ra(P.hot,R(.25,.75));g.beginPath();g.arc(x,y,R(.9,2.6),0,6.2832);g.fill()}
  /* tối góc + hạt giấy */
  q=g.createRadialGradient(W/2,H*.5,H*.35,W/2,H*.5,W*.75);q.addColorStop(0,'rgba(12,8,24,0)');q.addColorStop(1,'rgba(12,8,24,.3)');g.fillStyle=q;g.fillRect(0,0,W,H);
  q=g.createLinearGradient(0,0,0,H*.4);q.addColorStop(0,'rgba(20,16,44,.14)');q.addColorStop(1,'rgba(20,16,44,0)');g.fillStyle=q;g.fillRect(0,0,W,H*.4);
  for(let i=0;i<3000;i++){g.fillStyle=rnd()<.5?'rgba(255,240,220,'+R(.015,.05)+')':'rgba(10,6,20,'+R(.02,.06)+')';g.fillRect(R(0,W),R(0,H),R(1,2.4),R(1,2.4))}
  if(flip){const o=document.createElement('canvas');o.width=c.width;o.height=c.height;const og=o.getContext('2d');og.translate(c.width,0);og.scale(-1,1);og.drawImage(c,0,0);return o}
  return c}
$('pick').onclick=()=>{if(!run)$('file').click()};
$('file').onchange=e=>{const f=e.target.files[0];if(!f||run)return;const im=new Image(),u='',fr=new FileReader();
  im.onload=()=>{const L=1600,r=im.naturalWidth/im.naturalHeight;phW=r>=1?L:Math.round(L*r);phH=r>=1?Math.round(L/r):L;
    const w=Math.round(phW*SC),h=Math.round(phH*SC);phSharp=document.createElement('canvas');phSharp.width=w;phSharp.height=h;
    const g=phSharp.getContext('2d');g.imageSmoothingQuality='high';g.drawImage(im,0,0,w,h);
    const sm=document.createElement('canvas');sm.width=Math.max(2,w>>5);sm.height=Math.max(2,h>>5);sm.getContext('2d').drawImage(phSharp,0,0,sm.width,sm.height);
    phSoft=document.createElement('canvas');phSoft.width=w;phSoft.height=h;const q=phSoft.getContext('2d');q.imageSmoothingQuality='high';q.drawImage(sm,0,0,w,h);
    URL.revokeObjectURL(u);usePhoto=true;$('theme').value='Ảnh: '+f.name.replace(/\.[^.]+$/,'').slice(0,40);e.target.value='';$('start').click()};
  im.onerror=()=>stat('Không đọc được ảnh này, hãy thử ảnh khác.');fr.onerror=im.onerror;fr.onload=()=>{im.src=fr.result};fr.readAsDataURL(f)};
$('theme').addEventListener('input',()=>{usePhoto=false});
reset();setMode('scene');
})();
</script>
<script>
/* ---------- Intro: "Love Thuy" nét viết hoa mỹ, ánh kim lướt qua, tim bay, rồi tan thành cánh hoa & trái tim ---------- */
(()=>{
const o=document.getElementById('intro');if(!o)return;
const c=o.firstElementChild,x=c.getContext('2d');
let end=false,P=null,t0=0,D=1,W=0,H=0,letters=[],parts=[],hearts=[],stars=[],tc=null,tx=null,sc=null;
const bye=()=>{if(end)return;end=true;o.classList.add('out');setTimeout(()=>o.remove(),900)};
o.onclick=bye;setTimeout(bye,11000);
if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches){bye();return}
const cl=v=>Math.min(1,Math.max(0,v)),ease=t=>1-Math.pow(1-cl(t),3),back=t=>{t=cl(t);const s=1.9;return 1+(s+1)*Math.pow(t-1,3)+s*Math.pow(t-1,2)};
const TXT='Love Thuy',PINK=['#ff8fb0','#e0587f'],BLUE=['#74b8f7','#3f7fc6'];
const heart=(g,cx,cy,s)=>{g.beginPath();g.moveTo(cx,cy+s*.9);g.bezierCurveTo(cx-s*1.35,cy,cx-s*.9,cy-s*1.05,cx,cy-s*.36);g.bezierCurveTo(cx+s*.9,cy-s*1.05,cx+s*1.35,cy,cx,cy+s*.9);g.closePath()};
const star=(g,cx,cy,r)=>{g.beginPath();g.moveTo(cx,cy-r);g.quadraticCurveTo(cx,cy,cx+r,cy);g.quadraticCurveTo(cx,cy,cx,cy+r);g.quadraticCurveTo(cx,cy,cx-r,cy);g.quadraticCurveTo(cx,cy,cx,cy-r);g.fill()};
function init(){try{
  D=Math.min(devicePixelRatio||1,2);W=c.width=Math.round(innerWidth*D);H=c.height=Math.round(innerHeight*D);
  let fs=Math.min(W*.2,H*.22);const F=f=>'italic 600 '+f+'px Fraunces,Georgia,serif';
  x.font=F(fs);let tw=x.measureText(TXT).width;if(tw>W*.86){fs*=W*.86/tw;x.font=F(fs);tw=x.measureText(TXT).width}
  const sx=(W-tw)/2,by=H/2+fs*.3;P={fs,F:F(fs),sx,by,tw};
  letters=[];for(let i=0;i<TXT.length;i++){const ch=TXT[i];if(ch===' ')continue;letters.push({ch,px:sx+x.measureText(TXT.slice(0,i)).width,w:x.measureText(ch).width,delay:i*125,col:i<5?PINK:BLUE})}
  tc=document.createElement('canvas');tc.width=W;tc.height=H;tx=tc.getContext('2d');
  sc=document.createElement('canvas');sc.width=W;sc.height=H;const g=sc.getContext('2d');g.font=P.F;g.textBaseline='alphabetic';
  letters.forEach(l=>{const gr=g.createLinearGradient(l.px,by-fs*.85,l.px+l.w,by);gr.addColorStop(0,l.col[0]);gr.addColorStop(1,l.col[1]);g.fillStyle=gr;g.fillText(l.ch,l.px,by)});
  const dta=g.getImageData(0,0,W,H).data,area=tw*fs*.75*.4,s=Math.max(3,Math.round(Math.sqrt(area/4200)));
  const top=Math.max(0,Math.floor(by-fs*1.05)),bot=Math.min(H,Math.ceil(by+fs*.45));
  for(let y=top;y<bot;y+=s)for(let X=Math.floor(sx-fs*.1);X<sx+tw+fs*.2&&X<W;X+=s){if(X<0)continue;const i=(y*W+X)*4;
    if(dta[i+3]>120)parts.push({x:X,y,c:'rgb('+dta[i]+','+dta[i+1]+','+dta[i+2]+')',dl:(X-sx)/tw*1000+Math.random()*650,vx:(Math.random()*1.3+.4)*D,vy:(-Math.random()*1.5-.25)*D,sz:s*(.8+Math.random()*.9),rot:Math.random()*6.28,rs:(Math.random()-.5)*.014,ph:Math.random()*6.28,h:Math.random()<.07})}
  for(let i=0;i<26;i++)hearts.push({x:Math.random()*W,y:Math.random()*(H+120),s:(7+Math.random()*13)*D,sp:(.018+Math.random()*.03)*D,sw:(8+Math.random()*22)*D,ph:Math.random()*6.28,c:['#ff8fb0','#e0587f','#74b8f7','#ffc2a8'][Math.floor(Math.random()*4)],a:.2+Math.random()*.35});
  for(let i=0;i<30;i++)stars.push({x:sx-fs*.3+Math.random()*(tw+fs*.6),y:by-fs*1.05+Math.random()*fs*1.6,r:(3+Math.random()*7)*D,ph:Math.random()*6.28,sp:.003+Math.random()*.004,st:500+Math.random()*2400});
  t0=performance.now();requestAnimationFrame(f)}catch(e){bye()}}
function drawText(t){
  tx.clearRect(0,0,W,H);tx.save();tx.font=P.F;tx.textBaseline='alphabetic';tx.lineJoin='round';tx.lineCap='round';
  const br=1+.011*Math.sin(t*.0032),cy=P.by-P.fs*.3;tx.translate(W/2,cy);tx.scale(br,br);tx.translate(-W/2,-cy);
  const L=P.fs*3.5;
  for(const l of letters){const k=t-l.delay;if(k<=0)continue;
    const p=ease(k/1050),fa=ease((k-600)/800),gr=tx.createLinearGradient(l.px,P.by-P.fs*.85,l.px+l.w,P.by);gr.addColorStop(0,l.col[0]);gr.addColorStop(1,l.col[1]);
    tx.strokeStyle=gr;tx.shadowColor=l.col[1];
    if(p<1){tx.setLineDash([L,L]);tx.lineDashOffset=L*(1-p);tx.lineWidth=Math.max(2,D*3.2);tx.shadowBlur=D*12;tx.strokeText(l.ch,l.px,P.by);tx.setLineDash([])}
    if(fa>0){const yb=(1-back(fa))*P.fs*.1;tx.globalAlpha=fa;tx.shadowBlur=D*(18*(1-fa)+9);tx.fillStyle=gr;tx.fillText(l.ch,l.px,P.by+yb);
      tx.shadowBlur=0;tx.lineWidth=Math.max(1,D*1.3);tx.strokeText(l.ch,l.px,P.by+yb);tx.globalAlpha=1}
    else if(p>=1){tx.lineWidth=Math.max(2,D*3);tx.shadowBlur=D*12;tx.strokeText(l.ch,l.px,P.by)}}
  tx.restore();
  /* ánh kim lướt qua chữ */
  const sw=ease((t-2500)/1300);if(sw>0&&sw<1){const bx=P.sx-P.fs*.6+(P.tw+P.fs*1.2)*sw;tx.save();tx.globalCompositeOperation='source-atop';
    const gr=tx.createLinearGradient(bx-P.fs*.4,P.by-P.fs,bx+P.fs*.4,P.by+P.fs*.3);gr.addColorStop(0,'rgba(255,255,255,0)');gr.addColorStop(.5,'rgba(255,255,255,.92)');gr.addColorStop(1,'rgba(255,255,255,0)');
    tx.fillStyle=gr;tx.fillRect(P.sx-P.fs*.3,P.by-P.fs*1.1,P.tw+P.fs*.6,P.fs*1.7);tx.restore()}
  x.drawImage(tc,0,0)}
function underline(t,fade){const ul=ease((t-1500)/1200)*P.tw;if(ul<=0)return;const y=P.by+P.fs*.3,gr=x.createLinearGradient(P.sx,0,P.sx+P.tw,0);gr.addColorStop(0,'#e0587f');gr.addColorStop(1,'#3f7fc6');
  x.save();x.globalAlpha=fade;x.strokeStyle=gr;x.lineWidth=Math.max(3,D*3.2);x.lineCap='round';x.beginPath();x.moveTo(P.sx,y);x.quadraticCurveTo(P.sx+ul/2,y+P.fs*.07,P.sx+ul,y);x.stroke();
  if(ul<P.tw*.995){x.fillStyle='#fff';star(x,P.sx+ul,y,D*9)}else{const hp=ease((t-2700)/500);x.fillStyle='#e0587f';x.globalAlpha=fade*hp;heart(x,P.sx+P.tw+D*4,y-P.fs*.05,D*(10+6*hp))
    x.fill()}x.restore()}
function bgFx(t){
  const a=ease(t/900),g=x.createRadialGradient(W/2,P.by-P.fs*.3,0,W/2,P.by-P.fs*.3,P.tw*.7);g.addColorStop(0,'rgba(255,214,226,'+.55*a+')');g.addColorStop(.55,'rgba(210,228,252,'+.3*a+')');g.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=g;x.fillRect(0,0,W,H);
  const span=H+140*D;for(const h of hearts){const yy=((h.y-t*h.sp)%span+span)%span-70*D,xx=h.x+Math.sin(t*.0014+h.ph)*h.sw;x.globalAlpha=h.a*a;x.fillStyle=h.c;heart(x,xx,yy,h.s);x.fill()}x.globalAlpha=1}
function sparkles(t){for(const s of stars){if(t<s.st)continue;const k=Math.sin((t-s.st)*s.sp+s.ph);if(k<=0)continue;x.globalAlpha=k;x.fillStyle=k>.6?'#fff':'#ffe3ec';star(x,s.x,s.y,s.r*k)}x.globalAlpha=1}
function f(n){if(end)return;const t=n-t0,HOLD=3500;x.clearRect(0,0,W,H);bgFx(t);
  if(t<HOLD){drawText(t);underline(t,1)}
  else{const tt=t-HOLD;tx.clearRect(0,0,W,H);tx.drawImage(sc,0,0);
    tx.globalCompositeOperation='destination-out';for(const p of parts){if(tt-p.dl>0)tx.fillRect(p.x-1,p.y-1,p.sz+2,p.sz+2)}tx.globalCompositeOperation='source-over';x.drawImage(tc,0,0);
    underline(HOLD,Math.max(0,1-tt/450));
    for(const p of parts){const k=tt-p.dl;if(k<=0)continue;const a=Math.max(0,1-k/1250);if(a<=0)continue;
      const px=p.x+p.vx*k*.07+Math.sin(k*.004+p.ph)*k*.012,py=p.y+p.vy*k*.07-k*k*.000012*D;x.globalAlpha=a;x.fillStyle=p.c;
      if(p.h){heart(x,px,py,p.sz*1.3);x.fill()}else{x.beginPath();x.ellipse(px,py,p.sz*1.15,p.sz*.55,p.rot+p.rs*k,0,6.2832);x.fill()}}
    x.globalAlpha=1}
  sparkles(t);
  if(t>HOLD+3100)bye();else requestAnimationFrame(f)}
Promise.race([document.fonts.load('italic 600 80px Fraunces'),new Promise(r=>setTimeout(r,1500))]).then(init,init);
})();
</script>
<script>
